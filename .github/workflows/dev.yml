name: Check for New DEV Interactions and Add to Orbit
on:
  schedule:
    - cron: "0 0 */1 * *"
  workflow_dispatch:
jobs:
  comments-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up Ruby 3.4.13
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: 3.4.13
      - name: Bundle Install
        run: |
          gem install --no-document dev_orbit
      - name: Check for New Comments for a DEV Organization
        run: |
          dev_orbit --check-organization-comments --historical-import
        env:
          DEV_API_KEY: ${{ secrets.DEV_API_KEY }}
          DEV_ORGANIZATION: ${{ secrets.DEV_ORGANIZATION }}
          ORBIT_API_KEY: ${{ secrets.ORBIT_API_KEY }}
          ORBIT_WORKSPACE_ID: ${{ secrets.ORBIT_WORKSPACE_ID }}
